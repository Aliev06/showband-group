name: TikTok yoxla
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
      UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
    steps:
      - uses: actions/checkout@v4
      - run: cd news && python3 tiktok.py check
