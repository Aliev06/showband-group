name: 3 · Telegram düymələri və paylaşım (ani, Worker-dən)
on:
  repository_dispatch:
    types: [tg]
  schedule: [{cron: '23 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: bot, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TG_EVENT: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: ffmpeg (Reels yenidən hazırlamaq üçün)
        if: github.event_name == 'repository_dispatch' && (github.event.client_payload.kind == 'reply' || github.event.client_payload.cmd == 'yeni' || startsWith(github.event.client_payload.data, 'gt:') || startsWith(github.event.client_payload.data, 'rw:') || startsWith(github.event.client_payload.data, 'ph:') || startsWith(github.event.client_payload.data, 'nx:'))
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q pillow numpy
      - run: python news/tg.py poll
        if: github.event_name == 'repository_dispatch'
      - name: commit (sayt yenilənir → Netlify)
        run: |
          git config user.name "showband-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A . && git commit -m "bot: paylaşım" || exit 0
          git pull --rebase -q && git push -q
      - name: Instagram
        if: env.IG_TOKEN != ''
        run: python news/publish.py --ig-queue
      - name: commit IG status
        if: env.IG_TOKEN != ''
        run: |
          git add -A news && git commit -m "bot: instagram" || exit 0
          git pull --rebase -q && git push -q
