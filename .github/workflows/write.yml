name: 2 · Xəbər yaz (əl ilə; vaxt cədvəli Cloudflare Worker-dədir)
on:
  workflow_dispatch:
    inputs:
      only_send: {description: 'Yalnız göndərilməmiş qaralamaları göndər', type: boolean, default: false}
permissions: {contents: write}
concurrency: {group: bot, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q pillow numpy imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1
      - run: pip install -q pillow numpy
      - run: python news/collect.py
        if: ${{ !inputs.only_send }}
      - run: python news/write.py --n 1
        if: ${{ !inputs.only_send }}
      - run: python news/tg.py send-new
      - name: commit
        if: always()
        run: |
          git config user.name "showband-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A news && git commit -m "bot: qaralama" || exit 0
          for i in 1 2 3 4; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
