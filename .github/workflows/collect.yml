name: 1 · Xəbər topla (hər saat)
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: bot, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python news/collect.py
      - name: commit
        run: |
          git config user.name "showband-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A news/pool.json && git commit -m "bot: pool" || exit 0
          git pull --rebase -q && git push -q
