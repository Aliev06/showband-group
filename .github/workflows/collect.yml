name: 1 · Xəbər topla (hər saat)
on:
  schedule: [{cron: '17 * * * *'}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: bot, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: bash news/pool_sync.sh pull
      - run: python news/collect.py
      # hovuz main-ə yazılmır (hər saat saytın yenidən qurulmasının qarşısını alır) — ayrıca bot-data branch-ı
      - run: bash news/pool_sync.sh push
