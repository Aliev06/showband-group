<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Showband Oyun — canlı viktorina</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0e">
<link rel="icon" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--bg:#0b0b0e;--card:#18181d;--card2:#202027;--fg:#f4f4f6;--mute:#9a9aa6;--red:#e3122b;--red2:#ff4a5c;--line:rgba(255,255,255,.08);
  --ok:#22c55e;--bad:#ef4444;--gold:#f5c542;
  --a0:#e3122b;--a1:#1f6feb;--a2:#e0a100;--a3:#16a34a;
  --d:"Unbounded",system-ui,sans-serif;--s:"Montserrat",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a0b12 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--s);font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 0 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top img{height:30px;width:auto}
.pill{font:600 13px var(--s);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:99px;color:var(--mute);white-space:nowrap}
.pill b{color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--bad);animation:bl 1s infinite}@keyframes bl{50%{opacity:.3}}
.scr{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:18px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h1{font:800 clamp(26px,7vw,34px)/1.1 var(--d);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 clamp(20px,5.6vw,26px)/1.25 var(--d);margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
input{width:100%;font:600 20px var(--s);color:var(--fg);background:var(--card2);border:2px solid transparent;border-radius:16px;padding:16px 18px;outline:none}
input:focus{border-color:var(--red)}
.btn{width:100%;padding:17px;border-radius:16px;background:var(--red);font:600 17px var(--d);letter-spacing:.01em;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5}
.btn.ghost{background:var(--card2);font:600 15px var(--s)}
.err{color:var(--red2);font-weight:600;min-height:1.2em;margin:0}
.big{font:800 64px/1 var(--d);color:var(--red)}
.center{text-align:center}
.rev{display:flex;gap:14px;align-items:center}
.rev .st{font-size:34px}
.rev p{margin:2px 0 0;color:var(--mute);font-size:14px}
.row2{display:flex;gap:10px}
/* question */
.qh{display:flex;justify-content:space-between;align-items:center;font:600 14px var(--s);color:var(--mute)}
.timer{font:800 22px var(--d);color:var(--fg);min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px;transform-origin:left}
.qt{font:600 clamp(21px,6vw,28px)/1.25 var(--d);margin:6px 0 4px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:118px;border-radius:20px;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font:700 17px/1.25 var(--s);color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);transition:transform .12s,opacity .25s,filter .25s}
.opt:active{transform:scale(.97)}
.opt .sh{font-size:20px;opacity:.9}
.opt.o0{background:var(--a0)}.opt.o1{background:var(--a1)}.opt.o2{background:var(--a2)}.opt.o3{background:var(--a3)}
.opts.done .opt{opacity:.35;filter:saturate(.5)}.opts.done .opt.pick{opacity:1;filter:none;outline:3px solid #fff;outline-offset:2px}
.opts.rv .opt{opacity:.25}.opts.rv .opt.good{opacity:1;outline:3px solid #fff;outline-offset:2px}
.wait{text-align:center;color:var(--mute);font-weight:600}
/* result */
.res{text-align:center;padding:26px 18px;border-radius:24px}
.res.ok{background:linear-gradient(160deg,#15803d,#0f5132)}.res.bad{background:linear-gradient(160deg,#991b1b,#4c0d10)}
.res .ic{font-size:52px;line-height:1}
.res h2{font-size:28px;margin-top:8px}
.res .gain{font:800 40px var(--d);margin-top:6px}
.res p{margin:8px 0 0;opacity:.85}
/* leaderboard */
.lb{position:relative}
.lr{position:absolute;left:0;right:0;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.lr.me{background:#2a1015;border-color:var(--red)}
.lr .rk{font:800 18px var(--d);width:28px;text-align:center;color:var(--mute)}
.lr:nth-child(1) .rk{color:var(--gold)}
.lr .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .gn{font:700 12px var(--s);color:var(--ok);background:rgba(34,197,94,.12);padding:3px 7px;border-radius:99px;opacity:0;transition:opacity .4s .2s}
.lr .gn.show{opacity:1}
.lr .mv{font:700 12px var(--s);width:30px;text-align:center}
.mv.up{color:var(--ok)}.mv.dn{color:var(--bad)}
.lr .sc{font:800 17px var(--d);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.mine{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:#2a1015;border:1px solid var(--red);font-weight:700}
.mine b{font:800 18px var(--d)}
/* final */
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;text-align:center}
.pod>div{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 8px 8px;padding:14px 8px;min-width:0}
.pod>.p1{background:linear-gradient(180deg,#3a2a08,var(--card));border-color:var(--gold);padding-top:22px;padding-bottom:30px}
.pod>.p2{padding-bottom:18px}
.pod .md{font-size:30px}
.pod .n{font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .s{font:800 15px var(--d);color:var(--mute);margin-top:4px}
.list{display:flex;flex-direction:column;gap:6px}
.list div{display:flex;gap:12px;padding:10px 14px;border-radius:12px;background:var(--card);font-weight:600}
.list div.me{background:#2a1015;outline:1px solid var(--red)}
.list span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list span:first-child{color:var(--mute);width:22px}
.foot{text-align:center;color:var(--mute);font-size:13px}
.foot a{color:var(--fg)}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><img src="logo.webp" alt="Showband Group" width="105" height="30"><span class="pill" id="st"><span class="dot off" id="dot"></span><b id="cnt">0</b> oyunçu</span></div>
  <div id="v" class="scr"><div class="center sub">Qoşulur…</div></div>
</div>
<canvas class="conf" id="conf"></canvas>
<script src="net.js"></script>
<script>
const REVIEW='https://g.page/r/Cbr97eLlmJ8LEBM/review';
const SH=['▲','◆','●','■'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let pid=ls.get('sbq_id');if(!pid){pid=Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set('sbq_id',pid)}
let S={phase:null},view='',timerRAF=0,picked=null,lastRes='';

const net=Net('player',onMsg,on=>{$('#dot').classList.toggle('off',!on)});
net.onopen=()=>net.send({t:'hello',id:pid,gameId:ls.get('sbq_game')});

function onMsg(m){
  if(m.t==='count'){$('#cnt').textContent=m.players;$('#lc')&&($('#lc').textContent=m.players);if(S.phase==='q'&&picked!==null)$('#ans')&&($('#ans').textContent=`${m.answered}/${m.players} cavab verdi`);S.players=m.players;return}
  if(m.t==='err'){const e=$('#jerr');if(e)e.textContent={name:'Adını yaz (ən azı 2 hərf)',taken:'Bu ad artıq var — başqa ad yaz',full:'Oyun doludur'}[m.e]||'Xəta';const b=$('#jb');if(b)b.disabled=false;return}
  if(m.t==='got'){picked=m.a;markPicked();return}
  if(m.t==='state'){
    const prev=S;S=m;$('#cnt').textContent=m.players||0;
    if(m.me)ls.set('sbq_game',m.gameId);
    if(!m.me){return showJoin()}
    if(m.phase==='lobby')return showLobby();
    if(m.phase==='q'){if(view!=='q'+m.q.i){picked=m.mine;showQ()}return}
    if(m.phase==='reveal'){const key='r'+m.q.i+m.gameId;if(lastRes!==key){lastRes=key;showResult()}return}
    if(m.phase==='final'){if(view!=='final')showFinal();return}
  }
}

/* ---------- screens ---------- */
function setV(html,name){view=name;cancelAnimationFrame(timerRAF);$('#v').innerHTML=html;$('#v').style.animation='none';void $('#v').offsetWidth;$('#v').style.animation=''}

function showJoin(){
  if(view==='join')return;
  setV(`<div><h1>Canlı viktorina</h1><p class="sub" style="margin-top:8px">Adını yaz və oyuna qoşul. Ən sürətli və düzgün cavab verən qalib olur!</p></div>
  <form class="card" id="jf" style="display:grid;gap:12px" novalidate>
    <input id="nm" maxlength="24" autocomplete="nickname" placeholder="Adın" value="${esc(ls.get('sbq_name')||'')}">
    <p class="err" id="jerr"></p>
    <button class="btn" id="jb">Qoşul</button>
  </form>`,'join');
  $('#jf').onsubmit=e=>{e.preventDefault();const n=$('#nm').value.trim();if(n.length<2){$('#jerr').textContent='Adını yaz (ən azı 2 hərf)';return}
    ls.set('sbq_name',n);$('#jb').disabled=true;$('#jerr').textContent=net.open?'':'Serverə qoşulur…';net.send({t:'join',id:pid,name:n});
    setTimeout(()=>{if(view==='join'){$('#jb').disabled=false;$('#jerr').textContent='Serverə qoşulmaq alınmır. İnterneti yoxla və ya Wi-Fi ↔ mobil internet dəyiş.'}},7000)};
}

function showLobby(){
  if(view==='lobby')return;
  setV(`<div class="center"><div class="big">🎤</div><h1 style="margin-top:14px">Xoş gəldin, ${esc(S.me.name)}!</h1>
    <p class="sub" style="margin-top:8px">Oyun tezliklə başlayır. Telefonu yanında saxla 😉</p></div>
  <p class="foot">Oyunda olanlar: <b id="lc">${S.players}</b></p>`,'lobby');
}

function showQ(){
  const q=S.q;
  setV(`<div class="qh"><span>Sual ${q.i+1} / ${q.total}</span><span class="timer" id="tm">${q.dur}</span></div>
    <div class="bar"><i id="tb"></i></div>
    <div class="qt">${esc(q.text)}</div>
    <div class="opts" id="opts">${q.opts.map((o,k)=>`<button class="opt o${k}" data-k="${k}"><span class="sh">${SH[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <p class="wait" id="ans"></p>`,'q'+q.i);
  $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||picked!==null)return;picked=+b.dataset.k;markPicked();net.send({t:'ans',i:q.i,a:picked});if(navigator.vibrate)navigator.vibrate(30)};
  if(picked!==null)markPicked();
  const tick=()=>{const left=Math.max(0,S.endsAt-net.now());$('#tm').textContent=Math.ceil(left/1000);$('#tb').style.transform=`scaleX(${left/(q.dur*1000)})`;if(left>0)timerRAF=requestAnimationFrame(tick);else if(picked===null){$('#opts').classList.add('done');$('#ans').textContent='Vaxt bitdi ⏱'}};tick();
}
function markPicked(){const o=$('#opts');if(!o)return;o.classList.add('done');o.querySelectorAll('.opt').forEach(b=>b.classList.toggle('pick',+b.dataset.k===picked));$('#ans').textContent='Cavabın qəbul edildi ✓ Nəticə gözlənilir…'}

function showResult(){
  const m=S.mine,q=S.q;
  const ok=m&&m.ok,gain=m?m.gain:0;
  const head=ok?`<div class="res ok"><div class="ic">✓</div><h2>Düzgün!</h2><div class="gain">+${gain}</div>${m.streak>=3?`<p>🔥 ${m.streak} ardıcıl — +100 bonus</p>`:''}</div>`
    :`<div class="res bad"><div class="ic">${m&&m.answered?'✗':'⏱'}</div><h2>${m&&m.answered?'Səhv':'Cavab vermədin'}</h2><p>Düzgün cavab: <b>${esc(q.opts[q.correct])}</b></p></div>`;
  setV(`<div class="qh"><span>Sual ${q.i+1} / ${q.total}</span><span>${m?`${m.score} xal`:''}</span></div>${head}`,'res');
  if(ok)confetti(60);
  setTimeout(()=>{if(view==='res')showBoard()},2600);
}

function showBoard(){
  const top=S.top,m=S.mine,H=70;
  const inTop=m&&top.some(r=>r.me);
  setV(`<div class="qh"><span>Lider cədvəli · ${S.n} oyunçu</span><span>Sual ${S.q.i+1}/${S.q.total}</span></div>
    <div class="lb" id="lb" style="height:${top.length*H}px">${top.map((r,i)=>{
      const from=r.prev&&r.prev<=top.length?r.prev-1:top.length+.3;
      const mv=r.prev?r.prev-r.rank:0;
      return `<div class="lr${r.me?' me':''}" data-to="${i}" style="transform:translateY(${from*H}px)"><span class="rk">${r.rank}</span><span class="nm">${esc(r.name)}${r.streak>=3?' 🔥':''}</span>${r.gain?`<span class="gn">+${r.gain}</span>`:''}<span class="mv ${mv>0?'up':mv<0?'dn':''}">${mv>0?'▲'+mv:mv<0?'▼'+(-mv):''}</span><span class="sc" data-s="${r.score}" data-f="${r.score-r.gain}">${r.score-r.gain}</span></div>`}).join('')}</div>
    ${m&&!inTop?`<div class="mine"><span>Sən: ${m.rank}-ci yer${m.prev&&m.prev!==m.rank?` <span class="mv ${m.prev>m.rank?'up':'dn'}">${m.prev>m.rank?'▲'+(m.prev-m.rank):'▼'+(m.rank-m.prev)}</span>`:''}</span><b>${m.score}</b></div>`:''}
    <p class="wait">Növbəti sual tezliklə…</p>`,'board');
  requestAnimationFrame(()=>setTimeout(()=>{
    document.querySelectorAll('.lr').forEach(el=>{el.style.transform=`translateY(${el.dataset.to*H}px)`;el.querySelector('.gn')&&el.querySelector('.gn').classList.add('show')});
    countUp();
  },350));
}
function countUp(){const els=[...document.querySelectorAll('.sc')],t0=performance.now();
  const f=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);els.forEach(el=>el.textContent=Math.round(+el.dataset.f+(el.dataset.s-el.dataset.f)*e));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

function showFinal(){
  const t=S.top,m=S.mine,p=i=>t[i]?`<div class="p${i+1}"><div class="md">${['🥇','🥈','🥉'][i]}</div><div class="n">${esc(t[i].name)}</div><div class="s">${t[i].score}</div></div>`:'<div style="visibility:hidden"></div>';
  setV(`<div class="center"><h1>Qaliblər 🏆</h1>${m?`<p class="sub" style="margin-top:8px">Sən <b style="color:var(--fg)">${m.rank}-ci yer</b> · ${m.score} xal</p>`:''}</div>
    <div class="pod">${p(1)}${p(0)}${p(2)}</div>
    <div class="list">${t.slice(3).map(r=>`<div class="${r.me?'me':''}"><span>${r.rank}</span><span>${esc(r.name)}</span><b>${r.score}</b></div>`).join('')}</div>
    <div class="card center"><b>Oyunu bəyəndin?</b><p class="sub" style="margin:6px 0 14px">Showband Group-a Google-da rəy yaz ⭐</p><a class="btn" style="display:block;text-decoration:none;color:#fff" href="${REVIEW}" target="_blank" rel="noopener">Rəy yaz</a></div>
    <p class="foot"><a href="/">showbandgroup.az</a> · Toy, ad günü, korporativ</p>`,'final');
  if(m&&m.rank<=3)confetti(140);
}

/* ---------- confetti ---------- */
function confetti(n){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#e3122b','#f5c542','#1f6feb','#22c55e','#fff'],ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,s:5+Math.random()*6,c:cols[n%5===0?0:Math.floor(Math.random()*5)]}));
  let f=0;(function d(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<160)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
</script>
</body>
</html>
